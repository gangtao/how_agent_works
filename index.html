/* 布局：标题一行，概念按钮一行，中间是 3D 画板（左上角宋体标题，底部专业名对照），最下面播放控制。沿用博客配图的暖纸底、墨色、青绿和赭色，只做浅色。 */
:root{
  --paper:#EDE8DA; --sheet:#F3EFE4; --cream:#FFFBF0; --ink:#1B2A2E; --mute:#4E5F64; --rule:#C9CBC2;
  --patina:#2F6C5E; --patina-l:#E7F0EC; --amber:#B5651D; --red:#A8432F;
  --head:"Noto Serif SC","Songti SC","SimSun",serif;
  --body:"LXGW WenKai","Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1440px;margin:0 auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
/* 语言切换：标题右边的两段式按钮 */
.lang{display:inline-flex;flex:none;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.lang button{border:0;background:var(--sheet);color:var(--mute);font:500 13px var(--body);height:30px;padding:0 12px;cursor:pointer}
.lang button.on{background:var(--ink);color:var(--cream)}
/* 英文版：单词比单个汉字宽，Token 小方块改成按内容撑开 */
.stage.en #gloss{gap:calc(var(--u)*14) calc(var(--u)*30)}
.stage.en #gloss div{font-size:calc(var(--u)*21);gap:calc(var(--u)*9)}
.stage.en #gloss em{padding:.2em .55em}
.stage.en .lb.chip{width:auto;min-width:1.75em;padding:0 .32em;font-size:calc(var(--u)*19);height:2.3em;line-height:2.2em}
h1{font-family:var(--head);font-size:clamp(21px,2.3vw,30px);font-weight:900;margin:0;letter-spacing:.02em}
/* 进度菜单：嵌在画面顶部的一条时间线，每段宽度按这一幕的时长，下面的细线显示进度 */
nav{position:absolute;z-index:2;left:calc(var(--u)*56);right:calc(var(--u)*56);top:calc(var(--u)*18);display:flex;gap:calc(var(--u)*7)}
nav button{position:relative;min-width:0;border:0;background:none;color:var(--mute);font:500 calc(var(--u)*20) var(--body);padding:calc(var(--u)*3) 0 calc(var(--u)*13);cursor:pointer;white-space:nowrap;text-align:center;letter-spacing:.02em}
nav button::before,nav button::after{content:"";position:absolute;left:0;bottom:0;height:calc(var(--u)*4);border-radius:99px;pointer-events:none}
nav button::before{right:0;background:rgba(27,42,46,.13)}
nav button::after{width:calc(var(--p,0)*100%);background:var(--patina)}
nav button:hover{color:var(--ink)}
nav button.done{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.stage-scroll{overflow-x:auto;border-radius:8px}
.stage{--u:1px;position:relative;aspect-ratio:1600/1040;width:min(100%,calc((100vh - 190px)*1600/1040));min-width:720px;margin:0 auto;border-radius:8px;overflow:hidden;border:1px solid var(--rule);background:var(--paper);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.stage.drag{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hd{position:absolute;left:calc(var(--u)*56);top:calc(var(--u)*72);right:calc(var(--u)*56);pointer-events:none}
.hd b{font:900 calc(var(--u)*44) var(--head);color:var(--amber);margin-right:calc(var(--u)*16)}
.hd strong{font:900 calc(var(--u)*44) var(--head);color:var(--ink)}
.hd p{margin:calc(var(--u)*6) 0 0;font-size:calc(var(--u)*23);color:var(--mute)}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-weight:700;font-size:calc(var(--u)*25);line-height:1.22;color:var(--ink);text-align:center;will-change:transform,opacity;text-shadow:0 0 calc(var(--u)*5) var(--sheet),0 0 calc(var(--u)*5) var(--sheet),0 0 calc(var(--u)*9) var(--sheet)}
.lb small{display:block;font-weight:500;font-size:.74em;color:var(--mute)}
.lb.h{font-size:calc(var(--u)*33);color:var(--c,var(--ink))}
.lb.s{font-size:calc(var(--u)*21);font-weight:600;color:var(--c,var(--mute))}
.lb.big{font:900 calc(var(--u)*46) var(--head)}
.lb.tag{background:var(--c,var(--ink));color:var(--cream);border-radius:99px;padding:.28em .95em;font-size:calc(var(--u)*22);text-shadow:none;box-shadow:0 calc(var(--u)*3) calc(var(--u)*10) rgba(27,42,46,.18)}
.lb.pill{background:var(--cream);border:calc(var(--u)*2.5) solid var(--c,var(--ink));border-radius:99px;padding:.2em .8em;font-size:calc(var(--u)*22);text-shadow:none;box-shadow:0 calc(var(--u)*3) calc(var(--u)*10) rgba(27,42,46,.16)}
.lb.card{text-align:left;text-shadow:none;font-size:calc(var(--u)*24)}
.lb.card small{font-size:.66em}
.lb.chip{background:var(--cream);border:calc(var(--u)*2.5) solid var(--c,var(--ink));border-radius:calc(var(--u)*10);width:1.75em;height:1.95em;line-height:1.85em;font-size:calc(var(--u)*25);text-shadow:none;box-shadow:0 calc(var(--u)*4) calc(var(--u)*10) rgba(27,42,46,.2)}
.lb .n,.lb.n{display:inline-block;width:1.55em;height:1.55em;line-height:1.5em;border-radius:50%;background:var(--cream);border:calc(var(--u)*2.5) solid var(--c,var(--ink));color:var(--c,var(--ink));font-size:.82em;margin-right:.4em;text-shadow:none;vertical-align:.08em}
.lb.n{margin:0;font-size:calc(var(--u)*21)}
.lb.on .n,.lb.n.on{background:var(--c,var(--ink));color:var(--cream)}
.lb.stamp{border:calc(var(--u)*3) solid var(--c);color:var(--c);border-radius:calc(var(--u)*7);padding:.05em .45em;font-size:calc(var(--u)*23);background:rgba(255,251,240,.86);text-shadow:none}
.lb.dark{color:var(--cream);text-shadow:none}
.lb.mark{width:1.7em;height:1.7em;line-height:1.7em;border-radius:50%;background:var(--c);color:var(--cream);font-size:calc(var(--u)*28);text-shadow:none}
.gloss{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:calc(var(--u)*30);padding:calc(var(--u)*17) calc(var(--u)*56);background:linear-gradient(to bottom,rgba(243,239,228,0),rgba(243,239,228,.92) 28%);pointer-events:none}
.gloss::before{content:"";position:absolute;left:calc(var(--u)*56);right:calc(var(--u)*56);top:calc(var(--u)*6);height:1px;background:rgba(27,42,46,.16)}
.gloss .gl{font-size:calc(var(--u)*20);color:var(--mute);flex:none}
#gloss{display:flex;flex:1;gap:calc(var(--u)*14) calc(var(--u)*44);flex-wrap:nowrap;min-width:0}
#gloss div{display:flex;align-items:center;gap:calc(var(--u)*12);font:700 calc(var(--u)*24) var(--body);white-space:nowrap}
#gloss i{font-style:normal;color:#A9B1AE;font-size:.8em}
#gloss em{font-style:normal;font-size:.94em;color:var(--patina);background:var(--patina-l);border:calc(var(--u)*2) solid var(--patina);border-radius:calc(var(--u)*8);padding:.2em .7em}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(60,45,20,0) 58%,rgba(60,45,20,.09) 100%)}
.lb.pill.sm{font-size:calc(var(--u)*19);padding:.16em .7em .16em .3em}
.lb.pill.on{background:var(--c);color:var(--cream)}
.lb.pill.on .n{background:var(--cream);color:var(--c)}
#veil{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none}
#err[hidden]{display:none}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--mute);background:var(--sheet)}
.hint{position:absolute;right:calc(var(--u)*56);top:calc(var(--u)*86);font-size:calc(var(--u)*18);color:var(--mute);opacity:.75;pointer-events:none}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button{border:1px solid var(--rule);background:var(--sheet);color:var(--ink);height:34px;min-width:34px;padding:0 10px;border-radius:6px;cursor:pointer;font:500 13px var(--body);display:inline-flex;align-items:center;justify-content:center}
.ctl button:hover{border-color:var(--ink)}
.ctl svg{width:14px;height:14px;fill:currentColor}
.ctl input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--patina)}
.ctl .time{white-space:nowrap;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>Agent 是怎么干活的</h1>
    <div class="lang" role="group" aria-label="语言"><button type="button" data-l="zh" class="on" aria-pressed="true">中文</button><button type="button" data-l="en" aria-pressed="false">EN</button></div>
  </header>
  <div class="stage-scroll"><div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="AI Agent 工作原理 3D 动画"></canvas>
    <div id="labels"></div>

const GLOSS=[[["大脑","大模型"],["工作台","上下文窗口"],["手","工具"],["笔记柜","长期记忆"]],[["一圈一圈转","推理循环"],["摆桌面","提示词构建"],["问大脑","大模型调用"],["动手","工具调用"]],[["桌面","上下文窗口"],["摆桌面","提示词构建"],["岗位说明","系统提示词"],["不常变的部分","提示词缓存"]],[["一个一个往外说","流式生成"],["工具单","工具调用请求"],["大脑不动手","模型只输出文本"]],[["门卫","权限检查"],["自带的手","内置工具"],["先问人","人工确认"],["派分身","子 Agent"]],[["手册","技能 Skill"],["目录里的一行","技能描述"],["用到才翻开","渐进式加载"]],[["桌面占用","上下文占用"],["丢三落四","上下文腐化"],["清旧结果","工具结果清理"],["压成摘要","上下文压缩"]],[["翻笔记","记忆检索"],["变成查询","查询生成"],["打分","相关度排序"],["只拿几张","取前 K 条"]],[["挑值得带走的","记忆提取"],["盖章更新","记忆更新"],["久未用淘汰","记忆遗忘"],["相近合并","记忆整合"]],[["一圈一圈转","推理循环"],["工作台","上下文窗口"],["笔记柜","长期记忆"],["手","工具调用"]]];
const NAV=['Agent','推理循环','上下文窗口','大模型调用','工具与权限','技能','上下文管理','记忆检索','记忆与遗忘','全景'];

/* ---------- 搭建和播放 ---------- */
let acc=0;SC.forEach(s=>{s.t0=acc;acc+=s.d;s.g=new THREE.Group();s.g.visible=false;scene.add(s.g);s.labels=[];s.up=s.build(s.g,mkL(s.labels));});const TOTAL=acc;
const chips=$('chips'),scrub=$('scrub'),timeEl=$('time'),bPlay=$('bPlay'),icoPlay=$('icoPlay'),bSpeed=$('bSpeed'),glossEl=$('gloss'),veil=$('veil');
scrub.max=TOTAL;
let t=0,playing=true,speed=1,hold=0,last=performance.now(),curCh=-1,fixedT=null,az=0,el=0,drag=null,W=0,H=0,U=1;
const chipEls=SC.map((c,i)=>{const b=document.createElement('button');b.type='button';b.textContent=NAV[i];b.title=c.t;b.style.flex=c.d+' 1 0';b.addEventListener('click',()=>{t=c.t0+.001;hold=0;});chips.appendChild(b);return b;});
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce){t=TOTAL-.5;playing=false;}
const SPEEDS=[1,1.5,2,.5],fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const chAt=tt=>{let i=SC.length-1;while(i>0&&tt<SC[i].t0)i--;return i;};
function resize(){const r=stage.getBoundingClientRect();if(!r.width)return;W=r.width;H=r.height;U=W/1600;stage.style.setProperty('--u',U+'px');layer.style.setProperty('--u',U*1.07+'px');renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(W,H,false);cam.aspect=W/H;cam.setViewOffset(W,H,0,-26*U,W,H);cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
const cp=new V3(),cl=new V3();
function draw(){const tt=clamp(t,0,TOTAL-.0001),ci=chAt(tt),sc=SC[ci],p=(tt-sc.t0)/sc.d,T=fixedT!=null?fixedT:performance.now()/1000;
  if(ci!==curCh){SC.forEach((s,i)=>{s.g.visible=i===ci;});if(curLabels)curLabels.forEach(o=>{o.el.style.display='none';});curLabels=sc.labels;curLabels.forEach(o=>{o.el.style.display='';o._s='';o._op='';});curCh=ci;
    $('hdNo').textContent=String(ci+1).padStart(2,'0');$('hdT').textContent=TR(sc.t);$('hdS').textContent=TR(sc.c);
    glossEl.innerHTML=GLOSS[ci].map(x=>`<div><span>${TR(x[0])}</span><i>${LANG==='en'?'=':'＝'}</i><em>${cap(TR(x[1]))}</em></div>`).join('');
    chipEls.forEach((b,i)=>{b.classList.toggle('on',i===ci);b.classList.toggle('done',i<ci);if(i!==ci)b.style.setProperty('--p',i<ci?1:0);});}
  sc.up(p,T,U);
  /* 镜头：每幕一个机位，开场轻轻推近，全程缓慢左右摆；拖动可以再转一点 */
  const c=sc.cam,k=1.07-.07*es(p,0,.35),a=az+.045*Math.sin(T*.32+ci);cl.set(c.l[0],c.l[1],c.l[2]);cp.set(c.p[0],c.p[1],c.p[2]).sub(cl).multiplyScalar(k);
  const ca=Math.cos(a),sa=Math.sin(a),x=cp.x*ca+cp.z*sa,z=-cp.x*sa+cp.z*ca;cp.set(x,cp.y*(1+el),z).add(cl);cam.position.copy(cp);cam.lookAt(cl);cam.updateMatrixWorld();
  renderer.render(scene,cam);placeLabels(W,H);
  [...glossEl.children].forEach((q,i)=>{q.style.opacity=seg(p,.04+i*.05,.1+i*.05);});
  veil.style.opacity=Math.max(1-seg(p,0,.025),ci<SC.length-1?seg(p,.985,1):0).toFixed(2);
  chipEls[ci].style.setProperty('--p',p.toFixed(3));
  if(document.activeElement!==scrub)scrub.value=tt;timeEl.textContent=fmt(tt)+' / '+fmt(TOTAL);}
function setPlay(v){playing=v;icoPlay.innerHTML=v?'<path d="M4 2h3v12H4zM9 2h3v12H9z"/>':'<path d="M4 2l10 6-10 6z"/>';}
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){if(t>=TOTAL){hold+=dt;if(hold>4){t=0;hold=0;}}else t+=dt*speed;}
  if(!drag){az*=.96;el*=.96;}
  draw();requestAnimationFrame(loop);}
bPlay.addEventListener('click',()=>{if(!playing&&t>=TOTAL){t=0;hold=0;}setPlay(!playing);});
$('bPrev').addEventListener('click',()=>{const ci=chAt(Math.min(t,TOTAL-.001));t=SC[Math.max(0,(t-SC[ci].t0<1.2)?ci-1:ci)].t0+.001;hold=0;});
$('bNext').addEventListener('click',()=>{const ci=chAt(Math.min(t,TOTAL-.001));t=ci<SC.length-1?SC[ci+1].t0+.001:TOTAL;hold=0;});
bSpeed.addEventListener('click',()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];bSpeed.textContent=speed+'×';});
scrub.addEventListener('input',()=>{t=parseFloat(scrub.value);hold=0;});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();bPlay.click();}else if(e.code==='ArrowRight')$('bNext').click();else if(e.code==='ArrowLeft')$('bPrev').click();});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('nav'))return;drag={x:e.clientX,y:e.clientY,az,el};stage.classList.add('drag');stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{if(!drag)return;az=clamp(drag.az-(e.clientX-drag.x)/W*2.2,-.7,.7);el=clamp(drag.el+(e.clientY-drag.y)/H*.9,-.35,.5);});
const endDrag=()=>{drag=null;stage.classList.remove('drag');};stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
/* 语言切换：静态文字、进度菜单、所有标签一起换，再让当前这一幕重画标题和对照条 */
const STAT=[['h1','Agent 是怎么干活的'],['.hint','按住拖动可以转动视角'],['.gloss .gl','专业名对照'],['#err','这个浏览器没有开启 WebGL，3D 画面显示不出来。']],ARIA=[['#cv','AI Agent 工作原理 3D 动画'],['#chips','进度'],['#scrub','进度'],['#bPrev','上一幕'],['#bPlay','播放或暂停'],['#bNext','下一幕'],['#bSpeed','播放速度'],['.lang','语言']];
function setLang(l){LANG=l==='en'?'en':'zh';stage.classList.toggle('en',LANG==='en');STAT.forEach(x=>{document.querySelector(x[0]).textContent=TR(x[1]);});ARIA.forEach(x=>{document.querySelector(x[0]).setAttribute('aria-label',TR(x[1]));});
  chipEls.forEach((b,i)=>{b.textContent=LANG==='en'?NAV_EN[i]:NAV[i];b.title=TR(SC[i].t);});SC.forEach(s=>s.labels.forEach(o=>{o.el.innerHTML=TR(o._t);}));
  document.querySelectorAll('.lang button').forEach(b=>{const on=b.dataset.l===LANG;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});curCh=-1;try{localStorage.setItem('agent3d-lang',LANG);}catch(e){}}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
{let l=null;try{l=localStorage.getItem('agent3d-lang');}catch(e){}if(/[?#&]lang=en|#en$/.test(location.search+location.hash))l='en';if(l==='en')setLang('en');}
window.__lang=setLang;
window.__seek=(v,ft)=>{t=v;fixedT=ft==null?null:ft;setPlay(false);draw();};window.__sc=SC.map(s=>[s.t0,s.d]);
setPlay(playing);requestAnimationFrame(loop);
})();
</script>
